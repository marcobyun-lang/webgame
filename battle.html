        function skl() {
            if(isActing) return; 
            if(pStatus.stun > 0) { addLog("기절 상태라 스킬을 쓸 수 없습니다!"); pStatus.stun--; update(); setTimeout(eTurn, 1500); return; }

            let costRate = 0.6;
            if (player.job === '소서러') costRate = 0.3;
            if (player.job === '도적' || player.job === '어쌔신' || player.job === '섀도우') costRate = 0.4;
            if (player.job === '엘프 궁수') costRate = 0.3; // 궁수 스킬 마나 소모율
            if (player.job === '레인저') costRate = 0.8; // 엘프 레인저 화살비 스킬 마나 소모율 대폭 증가
            if (player.job === '스나이퍼') costRate = 0.7; // 스나이퍼 헤드샷 마나 소모율 증가

            if (pStatus.zeroMana > 0 || pStatus.nextSkillZeroCost > 0) costRate = 0;

            const cost = Math.floor(player.maxMp * costRate);
            if(player.mp < cost) { say('p', '마나가 부족해!'); return; }

            isActing = true;
            player.mp -= cost;
            if (pStatus.nextSkillZeroCost > 0) pStatus.nextSkillZeroCost = 0;
            update();

            const jobKey = player.job || '전사';
            playAttackSfx();

            setTimeout(() => {
                let isCrit = false; let dmg = 0;
                
                const skillSpeech = getSkillSpeech(player.job);
                say('p', skillSpeech);

                if(player.job === '도적' || player.job === '어쌔신' || player.job === '섀도우') {
                    let baseDmg = Math.floor(player.stats.dex * 0.5) + (player.level * 2);
                    let critChance = (player.job === '어쌔신') ? 0.55 : 0.4;
                    if (pStatus.critUp > 0) critChance = 1.0;
                    if (pStatus.aiming > 0) {
                        critChance += 0.2;
                        pStatus.aiming = 0;
                        addLog("🎯 조준 사격! 치명타 확률이 증가합니다.");
                    }
                    isCrit = Math.random() < critChance;
                    if (isCrit) {
                        dmg = (baseDmg * 4) + (player.bonusAtk||0);
                        playCritSfx();
                    }
                    else { dmg = baseDmg + (player.bonusAtk||0); }

                    let poisonChance = (player.job === '섀도우') ? 1.0 : 0.5;
                    if(Math.random() < poisonChance) { eStatus.poison = 3; addLog("적에게 독을 부여했습니다!"); }

                    if (isLegendary) {
                        document.getElementById('player-frame').classList.add('rogue-legendary-action');
                        setTimeout(() => document.getElementById('player-frame').classList.remove('rogue-legendary-action'), 500);
                    }

                    const vMap = {
                        '도적':'v-rogue', '어쌔신':'v-rogue1', '섀도우':'v-rogue1'
                    };
                    const v = document.getElementById(vMap[jobKey] || 'v-rogue'); const pImg = document.getElementById('p-img');
                    if(v) {
                        v.pause();
                        v.currentTime = 0; // Reset video to start
                        pImg.style.display='none'; v.style.display='block'; v.play();
                        v.onended = () => { v.style.display='none'; pImg.style.display='block'; applySkillDmg(player.job, dmg, isCrit); }
                    } else {
                        playMotion('atk-rogue', 'enemy-frame', isCrit?'crit':'rogue');
                        applySkillDmg(player.job, dmg, isCrit);
                    }
                    return;
                } else if (player.job === '엘프 궁수' || player.job === '스나이퍼' || player.job === '레인저') {
                    let vId = 'v-archer';
                    if (player.job === '스나이퍼') vId = 'v-archer1';
                    else if (player.job === '레인저') vId = 'v-archer2';

                    if (isLegendary) vId = 'v-archer3';

                    const v = document.getElementById(vId); const pImg = document.getElementById('p-img');
                    if(v) {
                        v.pause();
                        v.currentTime = 0;
                        pImg.style.display='none'; v.style.display='block'; v.play();
                        v.onended = () => {
                            v.style.display='none'; pImg.style.display='block';
                            applySkillDmg(player.job);
                        }
                    } else {
                        applySkillDmg(player.job);
                    }
                    return;
                } else {
                    let vMap = {
                        '전사': (Math.random() < 0.5 ? 'v-warrior' : 'v-warrior-alt'),
                        '마법사':'v-mage',
                        '버서커':'v-warrior1', '가디언':'v-warrior1',
                        '아크메이지':'v-mage1', '소서러':'v-mage1'
                    };

                    if (isLegendary) {
                        if (player.job === '마법사' || player.job === '아크메이지' || player.job === '소서러') {
                            vMap['마법사'] = 'v-mage2'; vMap['아크메이지'] = 'v-mage2'; vMap['소서러'] = 'v-mage2';
                        } else if (player.job === '전사' || player.job === '버서커' || player.job === '가디언') {
                            vMap['전사'] = 'v-warrior2'; vMap['버서커'] = 'v-warrior2'; vMap['가디언'] = 'v-warrior2';
                        }
                    }

                    const v = document.getElementById(vMap[jobKey]); const pImg = document.getElementById('p-img');
                    if(v) {
                        v.pause();
                        v.currentTime = 0;
                        pImg.style.display='none'; v.style.display='block'; v.play();
                        v.onended = () => { v.style.display='none'; pImg.style.display='block'; applySkillDmg(player.job); }
                    } else applySkillDmg(player.job);
                    return;
                }
            }, 200);
        }

        function applySkillDmg(job, preCalcDmg = 0, preCalcCrit = false) {
            let isCrit = preCalcCrit;
            let dmg = preCalcDmg;

            if (dmg === 0) {
                isCrit = Math.random() < 0.2;
                if (pStatus.critUp > 0) isCrit = true;
                if (pStatus.aiming > 0) {
                    isCrit = true; // 궁수 조준 시 스킬도 크리티컬 보정 (간소화)
                    pStatus.aiming = 0;
                }
                let multiplier = 2.0;

                if (job === '버서커') multiplier = 4.0;
                else if (job === '아크메이지') multiplier = 4.5;
                else if (job === '전사' || job === '가디언') multiplier = 2.5;
                else if (job === '마법사' || job === '소서러') multiplier = 2.2;
                else if (job === '엘프 궁수') {
                    multiplier = 0.5; // 약한 데미지
                    isCrit = false; // 크리티컬 없음
                }
                else if (job === '스나이퍼') multiplier = 1.5; // 스나이퍼 헤드샷 데미지 계수 감소
                else if (job === '레인저') multiplier = 1.0;

                if (currentWeather === "rain" && (job === '마법사' || job === '아크메이지' || job === '소서러')) {
                    multiplier *= 1.3;
                    addLog("<span style='color:#82b1ff'>비의 기운으로 마법이 강화되었습니다!</span>");
                }

                if(job === '전사' || job === '버서커' || job === '가디언') {
                    dmg = (player.stats.str * multiplier) + (player.level * 4);
                    if (job === '가디언' && Math.random() < 0.3) { eStatus.stun = 1; addLog("적을 기절시켰습니다!"); }
                } else if (job === '엘프 궁수') {
                    dmg = (player.stats.dex * multiplier) + (player.level * 1);
                    pStatus.windAttribute = 3;
                    addLog("🍃 [바람의 화살] 3턴간 공격에 바람 속성이 부여됩니다!");
                } else if (job === '스나이퍼') {
                    dmg = (enemy.hp * 0.1) + (player.stats.dex * multiplier) + (player.level * 2); // 스나이퍼 헤드샷 레벨 계수 감소
                    isCrit = true;
                } else if (job === '레인저') {
                    dmg = (player.stats.dex * multiplier) + (player.level * 2);
                    pStatus.doubleAttackChance = 3;
                    addLog("레인저의 [화살 비]! 3턴간 연속 공격 확률이 3배 증가합니다!");
                } else {
                    dmg = (player.stats.int * multiplier) + (player.level * 5);
                }

                if (pStatus.atkUp > 0 && (job === '버서커' || job === '전사')) dmg *= 2;

                dmg += (player.bonusAtk||0);
                if(isCrit) { dmg = Math.floor(dmg*2); playCritSfx(); }
            }

            if (pStatus.skillDmgUp > 0) {
                dmg = Math.floor(dmg * 1.5);
            }

            if (pStatus.nextSkillTriple > 0) {
                dmg *= 3;
                pStatus.nextSkillTriple = 0;
                pStatus.stun = 1;
                addLog("마력 폭주 반동으로 기절했습니다!");
            }

            if (isLegendary && (job === '전사' || job === '버서커' || job === '가디언')) {
                triggerScreenShake(true);
            }

            if (dmg > 0) {
                triggerHitEffect('enemy-frame', isCrit?'crit':'big');
                enemy.hp -= dmg;
                showDamage('enemy-frame', dmg, isCrit?'crit':'normal');
                if (isCrit) showCritEffect('enemy-frame');
                addLog(`스킬 적중! <span class='log-dmg'>${dmg}</span> 피해!`);
            }

            update(); check();
        }

        function rageAtk() {
            if(isActing || rage < maxRage) return;
            if(pStatus.stun > 0) { addLog("기절 상태라 분노 공격을 할 수 없습니다!"); return; }

            isActing = true;
            rage = 0;
            player.rage = 0;
            update();

            const pFrame = document.getElementById('player-frame');
            pFrame.classList.add('rage-active-aura');

            say('p', '분노의 일격!!!');
            playCritSfx();

            const killImg = document.getElementById('rage-kill-img');

            const baseJobs = ['전사', '도적', '마법사', '엘프 궁수'];
            if (!baseJobs.includes(player.job)) {
                killImg.src = 'image/damage_kill1.jpg';
            } else {
                killImg.src = 'image/damage_kill.jpg';
            }

            killImg.classList.add('rage-kill-anim');
            setTimeout(() => killImg.classList.remove('rage-kill-anim'), 2000);

            setTimeout(() => {
                let dmg = (Math.floor(player.stats.str/1.8) + (player.level*2) + 5 + (player.bonusAtk||0)) * 3;

                if (player.job === '엘프 궁수' || player.job === '스나이퍼' || player.job === '레인저') {
                    dmg = (Math.floor(player.stats.dex/2.0) + (player.level*2) + 5 + (player.bonusAtk||0)) * 3;
                }

                if (pStatus.windAttribute > 0) {
                    const windDmg = Math.floor(player.stats.int * 0.5);
                    dmg += windDmg;
                    addLog(`바람 속성 추가 피해 <span class='log-dmg'>${windDmg}</span>!`);
                    if (Math.random() < 0.25) {
                        eStatus.stun = 1;
                        addLog("바람의 힘으로 적이 기절했습니다!");
                    }
                }

                if (pStatus.atkUpRanger > 0) {
                    dmg = Math.floor(dmg * 1.2);
                }

                const jobKey = player.job || '전사';
                const imgMap = {
                    '전사':'atk-warrior', '도적':'atk-rogue', '마법사':'atk-mage', '엘프 궁수':'atk-archer',
                    '버서커':'atk-warrior', '가디언':'atk-warrior',
                    '어쌔신':'atk-rogue', '섀도우':'atk-rogue',
                    '아크메이지':'atk-mage', '소서러':'atk-mage',
                    '스나이퍼':'atk-archer', '레인저':'atk-archer'
                };

                if (isLegendary && (player.job === '전사' || player.job === '버서커' || player.job === '가디언')) {
                    triggerScreenShake(true);
                }

                playMotion(imgMap[jobKey], 'enemy-frame', 'crit');
                enemy.hp -= dmg;
                showDamage('enemy-frame', dmg, 'crit');
                showCritEffect('enemy-frame');
                addLog(`분노 공격! 적에게 <span class='log-dmg'>${dmg}</span>의 치명적인 피해를 입혔습니다!`);

                setTimeout(() => {
                    pFrame.classList.remove('rage-active-aura');
                }, 1000);

                update(); check();
            }, 500);
        }

        function check() { 
            if(enemy.hp <= 0) { say('e', '크윽..!'); setTimeout(win, 1000); }
            else { setTimeout(eTurn, 1500); }
        }
        
        function tickPlayerBuffs() {
            if (specialCooldown > 0) specialCooldown--;
            if (doubleAttackCooldown > 0) doubleAttackCooldown--;
            if (pStatus.defUp > 0) pStatus.defUp--;
            if (pStatus.atkUp > 0) pStatus.atkUp--;
            if (pStatus.invincible > 0) pStatus.invincible--;
            if (pStatus.zeroMana > 0) pStatus.zeroMana--;
            if (pStatus.skillDmgUp > 0) pStatus.skillDmgUp--;
            if (pStatus.critUp > 0) pStatus.critUp--;
            if (pStatus.evasionUp > 0) pStatus.evasionUp--;
            if (pStatus.doubleAttackChance > 0) pStatus.doubleAttackChance--;
            if (pStatus.invis > 0) pStatus.invis--;
            if (pStatus.windAttribute > 0) pStatus.windAttribute--;
            if (pStatus.atkUpRanger > 0) pStatus.atkUpRanger--;
            if (pStatus.evasionBoost > 0) pStatus.evasionBoost--;
            pStatus.counterReady = false; // Reset counter each turn
        }

        function eTurn() {
            if(eStatus.stun > 0) {
                addLog("적이 기절 상태라 행동할 수 없습니다!");
                eStatus.stun--;
                tickPlayerBuffs();
                update(); isActing = false; return;
            }

            if(eStatus.poison > 0) {
                const pDmg = Math.floor(enemy.maxHp * 0.05);
                enemy.hp -= pDmg;
                showDamage('enemy-frame', pDmg, 'poison');
                addLog(`적이 독으로 인해 <span style="color:#9b26b6">${pDmg}</span> 피해를 입었습니다.`);
                eStatus.poison--;
                update();
                if(enemy.hp <= 0) { win(); return; }
            }

            if(pStatus.poison > 0) {
                const pDmg = Math.floor(player.maxHp * 0.12);
                player.hp -= pDmg;
                showDamage('player-frame', pDmg, 'poison');
                addLog(`독으로 인해 <span style="color:#9b26b6">${pDmg}</span> 피해를 입었습니다.`);
                pStatus.poison--;
                update();
                if(player.hp <= 0) { showGameOver("독에 의해 쓰러졌습니다..."); return; }
            }

            let evadeChance = (player.stats.dex / 100) + (player.level * 0.005);
            if (player.job === '어쌔신' || player.job === '섀도우') evadeChance += 0.1;
            if (player.job === '엘프 궁수' || player.job === '스나이퍼' || player.job === '레인저') evadeChance += 0.05; // 궁수 기본 회피율 보너스
            if (pStatus.evasionUp > 0) evadeChance *= 2; // 엘프 궁수 특수기 효과
            if (pStatus.invis > 0) evadeChance = 1.0; // 스나이퍼 은신
            if (pStatus.evasionBoost > 0) evadeChance += 0.3; // 도적 방어 보너스

            if (currentWeather === "fog" && !(player.job === '엘프 궁수' || player.job === '스나이퍼' || player.job === '레인저')) {
                evadeChance += 0.1;
            }
            evadeChance = Math.min(0.7, evadeChance); // Max evade chance increased for defense boost

            if (Math.random() < evadeChance) {
                addLog("<span class='log-evade'>적의 공격을 회피했습니다!</span>");
                playEvadeSfx();
                say('p', '느려!');
                playMotion('', 'player-frame', 'evade');
                showDamage('player-frame', 0, 'evade');
                playEnemyAttackMotion();

                if (pStatus.evasionBoost > 0) {
                    rage = Math.min(maxRage, rage + 20);
                    addLog("회피 성공! 분노가 <span style='color:orange'>20</span> 충전되었습니다.");
                }

                tickPlayerBuffs();
                update(); isActing = false;
                return;
            }

            playEnemyAttackMotion();

            let dmg = Math.max(1, enemy.atk - Math.floor(player.stats.dex/3) - (player.bonusDef || 0));
            if (player.job === '가디언') dmg = Math.floor(dmg * 0.8);

            let isCrit = false;
            const critChance = 0.08;
            if (Math.random() < critChance) {
                dmg = Math.floor(dmg * 1.5);
                isCrit = true;
            }

            if (enemy.type === 'bear_warrior') {
                if (player.job === '마법사' || player.job === '아크메이지' || player.job === '소서러') {
                    dmg = Math.floor(dmg * 1.3);
                    addLog("<span style='color:orange'>곰전사 추파가 마법사에게 추가 피해를 입힙니다!</span>");
                }
            } else if (enemy.type === 'mage_holly') {
                if (player.job === '도적' || player.job === '어쌔신' || player.job === '섀도우' ||
                    player.job === '전사' || player.job === '버서커' || player.job === '가디언' ||
                    player.job === '엘프 궁수' || player.job === '스나이퍼' || player.job === '레인저') {
                    dmg = Math.floor(dmg * 1.3);
                    addLog("<span style='color:purple'>마법사 홀리가 물리 직업에게 추가 피해를 입힙니다!</span>");
                }
            }

            if (pStatus.invincible > 0) {
                dmg = 0;
                addLog("완전 방어로 공격을 무효화했습니다!");
            } else if (pStatus.defUp > 0) {
                let reduction = 0.5;
                if (['전사', '버서커', '가디언'].includes(player.job)) reduction = 0.4; // 전사 계열 60% 감소
                dmg = Math.floor(dmg * reduction);
                addLog("방어로 인해 피해가 크게 감소했습니다.");

                // 전사 반격 로직
                if (pStatus.counterReady && dmg > 0) {
                    setTimeout(() => {
                        let counterDmg = Math.floor((player.stats.str/2) + player.level);
                        enemy.hp -= counterDmg;
                        showDamage('enemy-frame', counterDmg, 'normal');
                        addLog(`⚔️ 반격! 적에게 <span class='log-dmg'>${counterDmg}</span>의 피해를 돌려주었습니다!`);
                        update();
                    }, 500);
                }
            }

            if (dmg > 0) {
                player.hp -= dmg;

                const cha = player.stats.cha || 10;
                const chaRageBonus = (cha - 10) * 0.005;
                rage = Math.min(maxRage, rage + Math.floor(dmg * 1.5 + chaRageBonus));
                player.rage = rage;

                playDamageSfx();
                const jobKey = player.job || '전사';
                const hitMap = {
                    '전사':'hit-warrior', '도적':'hit-rogue', '마법사':'hit-mage', '엘프 궁수':'hit-archer',
                    '버서커':'hit-warrior', '가디언':'hit-warrior',
                    '어쌔신':'hit-rogue', '섀도우':'hit-rogue',
                    '아크메이지':'hit-mage', '소서러':'hit-mage',
                    '스나이퍼':'hit-archer', '레인저':'hit-archer'
                };

                if (isCrit) {
                    triggerScreenShake(true);
                    playMotion(hitMap[jobKey], 'player-frame', 'big');
                    showDamage('player-frame', dmg, 'player_hit');
                    showCritEffect('player-frame');
                    say('e', '크하하하!');
                    addLog(`<span style='color:red; font-weight:bold; font-size:1.2rem;'>치명상! ${dmg} 피해!</span>`);
                } else {
                    playMotion(hitMap[jobKey], 'player-frame', 'player_hit');
                    showDamage('player-frame', dmg, 'player_hit');

                    if (enemy.speech && enemy.speech.length > 0) {
                        const randSpeech = enemy.speech[Math.floor(Math.random() * enemy.speech.length)];
                        say('e', randSpeech);
                    } else {
                        say('e', '받아라!');
                    }

                    addLog(`적이 공격합니다! <span style='color:red'>${dmg}</span> 피해를 입었습니다.`);
                }

                let poisonChance = enemy.canPoison ? 0.3 : 0;
                if(Math.random() < poisonChance) { pStatus.poison = 3; addLog("<span style='color:#9b26b6'>적의 공격에 중독되었습니다!</span>"); }
                if(Math.random() < 0.1) { pStatus.stun = 1; addLog("기절했습니다!"); }
            }

            tickPlayerBuffs();
            update(); isActing = false;
            if(player.hp <= 0) { showGameOver("패배했습니다..."); }
        }

        function sendRankingData(score, survivalTime) {
            const bossKills = player.quests.bossKillCount || 0;
            fetch(DB_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({
                    type: 'ranking',
                    name: player.name,
                    score: score,
                    job: player.job,
                    level: player.level,
                    bossKills: bossKills
                })
            });
        }

        function showGameOver(msg) {
            isActing = true;
            document.querySelectorAll('.btns .btn').forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = '0.5';
                btn.style.cursor = 'not-allowed';
            });
            const rageBtn = document.getElementById('btn-rage');
            if(rageBtn) rageBtn.style.display = 'none';

            stopBossBgm();

            // 스코어 계산 중 오버레이 표시
            const calcOverlay = document.getElementById('score-calculating-overlay');
            calcOverlay.style.display = 'flex';

            setTimeout(() => {
                const startTime = parseInt(localStorage.getItem('rpg_start_time') || Date.now());
                const survivalTime = Math.floor((Date.now() - startTime) / 1000);
                const min = Math.floor(survivalTime / 60);
                const sec = survivalTime % 60;

                const kills = player.quests.killCount || 0;
                const midBossKills = player.quests.bossKillCount || 0;
                const superBossKills = player.quests.superBossKillCount || 0;
                const normalKills = Math.max(0, kills - midBossKills - superBossKills);

                let itemValue = 0;
                player.inventory.forEach(item => {
                    if (item.type === 'weapon') {
                        if (item.rarity === 'legendary') itemValue += 5000;
                        else if (item.rarity === 'epic') itemValue += 2000;
                    } else if (item.type.includes('potion') || item.type.includes('scroll')) {
                        const rareItems = ['potion_full', 'potion_focus', 'potion_madness', 'potion_skeleton', 'potion_holy', 'potion_gamble', 'scroll_option'];
                        if (rareItems.includes(item.type)) itemValue += 500;
                    }
                });

                const lvScore = player.level * 1000;
                const midBossScore = midBossKills * 2000;
                const superBossScore = superBossKills * 10000;
                const normalScore = normalKills * 10;
                const goldScore = Math.floor(player.gold * 0.1);
                const survivalScore = survivalTime;
                const coinScore = player.coinScore || 0;
                const merchantScore = player.merchantUsed ? 1000 : 0;

                const totalScore = lvScore + midBossScore + superBossScore + normalScore + goldScore + itemValue + survivalScore + coinScore + merchantScore;

                const statsContainer = document.getElementById('go-stats-container');
                statsContainer.innerHTML = `
                    <div class="go-row"><div class="go-label">🔹 캐릭터 레벨</div><div class="go-val">${player.level} (LV) <span style="color:#888; font-size:0.8rem;">+${lvScore.toLocaleString()}</span></div></div>
                    <div class="go-row"><div class="go-label">💀 최종 보스 처치</div><div class="go-val">${superBossKills} (마리) <span style="color:#888; font-size:0.8rem;">+${superBossScore.toLocaleString()}</span></div></div>
                    <div class="go-row"><div class="go-label">💀 중간 보스 처치</div><div class="go-val">${midBossKills} (마리) <span style="color:#888; font-size:0.8rem;">+${midBossScore.toLocaleString()}</span></div></div>
                    <div class="go-row"><div class="go-label">⚔️ 몬스터 사냥</div><div class="go-val">${normalKills} (마리) <span style="color:#888; font-size:0.8rem;">+${normalScore.toLocaleString()}</span></div></div>
                    <div class="go-row"><div class="go-label">💰 보유 자산</div><div class="go-val">${player.gold.toLocaleString()} (G) <span style="color:#888; font-size:0.8rem;">+${goldScore.toLocaleString()}</span></div></div>
                    <div class="go-row"><div class="go-label">💎 아이템 가치</div><div class="go-val"><span style="color:#888; font-size:0.8rem;">+${itemValue.toLocaleString()}</span></div></div>
                    <div class="go-row"><div class="go-label">🪙 코인 점수</div><div class="go-val">${coinScore.toLocaleString()} <span style="color:#888; font-size:0.8rem;">+${coinScore.toLocaleString()}</span></div></div>
                    <div class="go-row"><div class="go-label">🎰 고블린 상인 조우</div><div class="go-val">${player.merchantUsed ? '완료' : '미발견'} <span style="color:#888; font-size:0.8rem;">+${merchantScore.toLocaleString()}</span></div></div>
                    <div class="go-row"><div class="go-label">⏳ 생존 보너스</div><div class="go-val">${min}분 ${sec}초 <span style="color:#888; font-size:0.8rem;">+${survivalScore.toLocaleString()}</span></div></div>
                `;

                document.querySelector('.gameover-title').innerText = msg;
                document.getElementById('go-score-val').innerText = totalScore.toLocaleString();

                sendRankingData(totalScore, survivalTime);

                localStorage.removeItem('rpg_temp_player');
                localStorage.removeItem('rpg_boss_x'); localStorage.removeItem('rpg_boss_y');
                localStorage.removeItem('rpg_boss_death_time');

                calcOverlay.style.display = 'none';
                document.getElementById('gameover-modal').style.display = 'flex';
            }, 2000); // 2초간 계산 중 메시지 표시
        }

        function getWeaponImage(job, rarity) {
            let baseJob = '전사';
            if (['도적', '어쌔신', '섀도우'].includes(job)) baseJob = '도적';
            if (['마법사', '아크메이지', '소서러'].includes(job)) baseJob = '마법사';
            if (['엘프 궁수', '스나이퍼', '레인저'].includes(job)) baseJob = '엘프 궁수';

            if (baseJob === '전사') {
                if (rarity === 'legendary') return 'legend_warrior.jpg';
                if (rarity === 'epic') return 'epic_warrior.jpg';
                return 'weapon_warrior.jpg';
            } else if (baseJob === '도적') {
                if (rarity === 'legendary') return 'legend_rogue.jpg';
                if (rarity === 'epic') return 'epic_rogue.jpg';
                return 'weapon_rogue.jpg';
            } else if (baseJob === '마법사') {
                if (rarity === 'legendary') return 'legend_mage.jpg';
                if (rarity === 'epic') return 'epic_mage.jpg';
                return 'weapon_mage.jpg';
            } else if (baseJob === '엘프 궁수') {
                if (rarity === 'legendary') return 'legend_archer.jpg';
                if (rarity === 'epic') return 'epic_archer.jpg';
                if (rarity === 'rare') return 'rare_archer.jpg';
                return 'weapon_archer.jpg';
            }
            return 'weapon_warrior.jpg';
        }

        function win() {
            stopBossBgm();
            const isNight = localStorage.getItem('rpg_is_night') === 'true';

            if (isBossBattle) {
                if (isSuperBoss) {
                    localStorage.setItem('rpg_super_boss_killed', 'true');
                    player.quests.superBossKillCount = (player.quests.superBossKillCount || 0) + 1;
                } else {
                    localStorage.setItem('rpg_boss_death_time', Date.now());
                    player.quests.bossKillCount = (player.quests.bossKillCount || 0) + 1;
                }
                localStorage.removeItem('rpg_boss_x'); localStorage.removeItem('rpg_boss_y');
            } else {
                if (isNight) player.quests.nightKillCount = (player.quests.nightKillCount || 0) + 1;
                else player.quests.dayKillCount = (player.quests.dayKillCount || 0) + 1;
            }

            player.exp += enemy.exp;
            player.quests.killCount++;

            let resultHTML = `<div class="result-row">획득 경험치 <span style="color:violet">+${enemy.exp} EXP</span></div>`;

            const gold = Math.floor(Math.random()*50)+10 + (isBossBattle ? 500 : 0);
            player.gold = (player.gold||0) + gold;
            resultHTML += `<div class="result-row">획득 골드 <span style="color:gold">+${gold} G</span></div>`;
            playGoldSfx();

            const drops = [];
            const cha = player.stats.cha || 10;
            const chaDropBonus = (cha - 10) * 0.005;

            const generateConsumable = () => {
                const r = Math.random();
                const ns = isNight ? "_night" : "";
                const holyNs = isNight ? "_night" : "";
                let item = null;
                let rarity = 'common';

                if (r < 0.008 + chaDropBonus) {
                    const img = "potion_full" + ns + ".jpg";
                    item = {name:'풀 회복 포션', type:'potion_full', desc:'HP와 MP를 모두 회복합니다.', val:200, img: img};
                    rarity = 'epic';
                } else if (r < 0.018 + chaDropBonus) {
                     const img = "potion_focus" + ns + ".jpg";
                     item = {name:'정신 집중 포션', type:'potion_focus', desc:'다음 스킬 마나 0 & 3턴간 스킬 데미지 50% 증가', val:0, img: img};
                     rarity = 'rare';
                } else if (r < 0.03 + chaDropBonus) {
                     const img = "potion_madness" + ns + ".jpg";
                     item = {name:'광기의 물약', type:'potion_madness', desc:'HP 30% 감소, 3턴간 100% 크리티컬', val:0, img: img};
                     rarity = 'rare';
                } else if (r < 0.05 + chaDropBonus) {
                    const img = "potion_skeleton" + ns + ".jpg";
                    item = {name:'해골 포션', type:'potion_skeleton', desc:'HP/MP 완전 회복 (다음 전투 저주)', val:0, img: img};
                    rarity = 'rare';
                } else if (r < 0.08 + chaDropBonus) {
                     const img = "potion_holy" + holyNs + ".jpg";
                     item = {name:'정화의 성수', type:'potion_holy', desc:'모든 상태 이상 해제', val:0, img: img};
                     rarity = 'rare';
                } else if (r < 0.12 + chaDropBonus) {
                    const img = "potion_gamble" + ns + ".jpg";
                    item = {name:'도박사의 시약', type:'potion_gamble', desc:'8가지 효과 중 하나가 무작위로 발동합니다.', val:0, img: img};
                    rarity = 'rare';
                } else if (r < 0.25 + chaDropBonus) {
                    const img = "Scroll" + ns + ".jpg";
                    item = {name:'옵션 부여 스크롤', type:'scroll_option', desc:'장비 옵션 재설정 (1~3개)', val:0, img: img};
                    rarity = 'epic';
                } else {
                    const subR = Math.random();
                    if(subR < 0.3) { const img = "potion_hp" + ns + ".jpg"; item = {name:'체력 물약', type:'potion_hp', desc:'HP +50 회복', val:50, img: img}; }
                    else if(subR < 0.6) { const img = "potion_mp" + ns + ".jpg"; item = {name:'마나 물약', type:'potion_mp', desc:'MP +30 회복', val:30, img: img}; }
                    else if(subR < 0.8) { const img = "potion_exp" + ns + ".jpg"; item = {name:'경험치 물약', type:'potion_exp', desc:'EXP +100 획득', val:100, img: img}; }
                    else { const img = "potion_poison" + ns + ".jpg"; item = {name:'해독 물약', type:'potion_poison', desc:'독 상태 해제', val:0, img: img}; }
                }
                return { item, rarity };
            };

            const rand = Math.random();
            if (isBossBattle && rand < 0.5 + chaDropBonus) {
                const jobList = DROP_TABLE[player.job] || DROP_TABLE['전사'];
                const baseName = jobList[Math.floor(Math.random() * jobList.length)];
                let isLegendary = isSuperBoss || Math.random() < 0.3 + chaDropBonus;
                if (!player.isAdvanced) isLegendary = false;
                let grade = isLegendary ? Math.floor(Math.random() * 6) + 10 : Math.floor(Math.random() * 5) + 8;
                let colorCode = isLegendary ? "#ff8000" : "#a335ee";
                let rarityName = isLegendary ? "전설의" : "에픽";
                const newItem = { name: `${rarityName} ${baseName} (+${grade})`, type: 'weapon', desc: `공격력 +${grade} (${player.job} 전용)`, val: grade, reqJob: player.job, equipped: false, rarity: isLegendary ? "legendary" : "epic", rarityColor: colorCode, enhanceCount: grade, options: [] };
                const optCount = isLegendary ? 3 : 1;
                const possibleOpts = [{name:"힘",key:"str",val:Math.floor(Math.random()*5)+2}, {name:"민첩",key:"dex",val:Math.floor(Math.random()*5)+2}, {name:"체력",key:"con",val:Math.floor(Math.random()*5)+2}, {name:"지능",key:"int",val:Math.floor(Math.random()*5)+2}];
                for(let i=0; i<optCount; i++) { const opt = possibleOpts[Math.floor(Math.random()*possibleOpts.length)]; newItem.options.push(opt); newItem.desc += `\n[옵션] ${opt.name} +${opt.val}`; }

                if (newItem.rarity === "legendary") {
                     const specialOpt = LEGENDARY_SPECIAL_OPTIONS[Math.floor(Math.random() * LEGENDARY_SPECIAL_OPTIONS.length)];
                     newItem.specialOption = specialOpt;
                     newItem.desc += `\n<span style='color:#b2ff59; font-weight:bold;'>[특수] ${specialOpt.name}</span>\n<span style='color:#aaa; font-size:0.7rem;'>${specialOpt.desc}</span>`;
                }

                drops.push({ item: newItem, rarity: newItem.rarity });
            } 
            else if (!isBossBattle && rand < 0.05 + chaDropBonus) {
                const nameList = DROP_TABLE[player.job] || DROP_TABLE['전사'];
                const baseName = nameList[Math.floor(Math.random() * nameList.length)];
                let isLegendary = false;
                if (player.isAdvanced && Math.random() < 0.01 + chaDropBonus) isLegendary = true;
                let grade = isLegendary ? Math.floor(Math.random() * 6) + 10 : Math.floor(Math.random() * 5) + 8;
                let colorCode = isLegendary ? "#ff8000" : "#a335ee";
                let rarityName = isLegendary ? "전설의" : "에픽";
                let rarity = isLegendary ? "legendary" : "epic";
                const newItem = { name: `${rarityName} ${baseName} (+${grade})`, type: 'weapon', desc: `공격력 +${grade} (${player.job} 전용)`, val: grade, reqJob: player.job, equipped: false, rarity: rarity, rarityColor: colorCode, enhanceCount: grade, options: [] };
                const optCount = isLegendary ? 3 : 1;
                const possibleOpts = [{name:"힘",key:"str",val:Math.floor(Math.random()*5)+1}, {name:"민첩",key:"dex",val:Math.floor(Math.random()*5)+1}, {name:"체력",key:"con",val:Math.floor(Math.random()*5)+1}, {name:"지능",key:"int",val:Math.floor(Math.random()*5)+1}];
                for(let i=0; i<optCount; i++) { const opt = possibleOpts[Math.floor(Math.random()*possibleOpts.length)]; newItem.options.push(opt); newItem.desc += `\n[옵션] ${opt.name} +${opt.val}`; }

                if (newItem.rarity === "legendary") {
                     const specialOpt = LEGENDARY_SPECIAL_OPTIONS[Math.floor(Math.random() * LEGENDARY_SPECIAL_OPTIONS.length)];
                     newItem.specialOption = specialOpt;
                     newItem.desc += `\n<span style='color:#b2ff59; font-weight:bold;'>[특수] ${specialOpt.name}</span>\n<span style='color:#aaa; font-size:0.7rem;'>${specialOpt.desc}</span>`;
                }

                drops.push({ item: newItem, rarity: newItem.rarity });
            }
            else if (Math.random() < 0.6 + chaDropBonus) {
                drops.push(generateConsumable());
            }
            else if (Math.random() < 0.2 + chaDropBonus) {
                const rand = Math.random();
                const ns = isNight ? "_night" : "";
                let item = null;
                if(rand < 0.5) {
                    const val = Math.floor(Math.random() * 5) + 1;
                    const img = "attack_10" + ns + ".jpg";
                    item = {name:'공격력 강화 물약', type:'potion_atk', desc:`공격력 +${val} 영구 증가`, val:val, img: img};
                } else {
                    const val = Math.random() < 0.5 ? 1 : 5;
                    const img = "Defense_10" + ns + ".jpg";
                    item = {name:'방어력 강화 물약', type:'potion_def', desc:`방어력 +${val} 영구 증가`, val:val, img: img};
                }
                drops.push({ item: item, rarity: 'rare' });
            }

            if (drops.length > 0 && Math.random() < 0.05 + (chaDropBonus/2)) {
                drops.push(generateConsumable());
                addLog("<span style='color:#ffd700; font-weight:bold;'>🍀 행운! 아이템을 하나 더 발견했습니다!</span>");
            }

            let bestDrop = null;
            const rarityWeight = { 'legendary': 4, 'epic': 3, 'rare': 2, 'common': 1 };

            drops.forEach(d => {
                player.inventory.push(d.item);

                let dropColor = "#fff";
                if (d.rarity === 'legendary') dropColor = "#ff8000";
                else if (d.rarity === 'epic') dropColor = "#a335ee";
                else if (d.rarity === 'rare') dropColor = "#2196f3";

                let dropImg = d.item.img;
                if (d.item.type === 'weapon') dropImg = getWeaponImage(player.job, d.item.rarity);

                resultHTML += `<div class="result-item-box"><img src="image/${dropImg}" class="result-item-img"><div class="result-item-name" style="color:${dropColor}">${d.item.name}</div><div style="font-size:0.8rem; color:#aaa;">아이템을 획득했습니다!</div></div>`;

                if (!bestDrop || rarityWeight[d.rarity] > rarityWeight[bestDrop.rarity]) {
                    bestDrop = d;
                    bestDrop.displayImg = dropImg;
                }
            });

            if (drops.length > 0) {
                playItemSfx();
                const imgEl = document.getElementById('drop-item-img');
                imgEl.src = `image/${bestDrop.displayImg}`;

                imgEl.className = 'drop-item-effect';
                if (bestDrop.rarity === 'legendary') imgEl.classList.add('border-legendary');
                else if (bestDrop.rarity === 'epic') imgEl.classList.add('border-epic');
                else if (bestDrop.rarity === 'rare') imgEl.classList.add('border-rare');
                else imgEl.classList.add('border-common');

                imgEl.style.display = 'block';
                setTimeout(() => { imgEl.style.display = 'none'; showResultModal(resultHTML); }, 2000);
            } else {
                showResultModal(resultHTML);
            }
        }

        function showResultModal(html) { document.getElementById('result-content').innerHTML = html; document.getElementById('result-modal').style.display = 'flex'; }
        
        function checkLevelUpOrFinish() { 
            document.getElementById('result-modal').style.display = 'none'; 
            if(player.exp >= player.maxExp) { showLevelUpModal(); } 
            else { finishBattle(); } 
        }
        
        function showLevelUpModal() {
            playLevelupSfx();
            const modal = document.getElementById('levelup-modal');
            const oldLv = player.level;
            const oldHp = player.maxHp;
            const oldMp = player.maxMp;
            player.level++;
            player.exp -= player.maxExp;
            player.maxExp = Math.floor(player.maxExp * 1.5);
            player.maxHp += 10;
            player.maxMp += 5;
            player.hp = player.maxHp;
            player.mp = player.maxMp;
            player.traitPoints = (player.traitPoints || 0) + 2;
            document.getElementById('old-lv').innerText = oldLv;
            document.getElementById('new-lv').innerText = player.level;
            document.getElementById('stat-hp').innerHTML = `${Math.round(oldHp)} <span class='stat-up'>▷ ${Math.round(player.maxHp)} (+10)</span>`;
            document.getElementById('stat-mp').innerHTML = `${Math.round(oldMp)} <span class='stat-up'>▷ ${Math.round(player.maxMp)} (+5)</span>`;

            const btn = document.getElementById('lv-confirm-btn');
            if (player.level >= 5 && !player.isAdvanced) {
                btn.innerText = "전직하러 가기";
            } else {
                btn.innerText = "특성 분배하러 가기";
            }

            modal.style.display = 'flex';
        }
        
        function finishBattle() {
            player.rage = rage;
            player.specialCooldown = specialCooldown;
            localStorage.setItem('rpg_temp_player', JSON.stringify(player));
            location.href = 'map.html';
        }

        function finishBattleWithLevelUp() {
            player.rage = rage;
            player.specialCooldown = specialCooldown;
            localStorage.setItem('rpg_temp_player', JSON.stringify(player));
            if (!(player.level >= 5 && !player.isAdvanced)) {
                localStorage.setItem('rpg_open_traits', 'true');
            }
            location.href = 'map.html';
        }
        
        function run() { 
            if(isActing) return; isActing = true; 

            const cha = player.stats.cha || 10;
            const chaRunBonus = (cha - 10) * 0.01; // 1% per CHA point above 10

            let runChance = isBossBattle ? 0.3 : 0.4;
            runChance += chaRunBonus;

            if(Math.random() < runChance) {
                say('p', "튀어!");
                addLog("무사히 도망쳤습니다!");
                stopBossBgm();

                if (isBossBattle && !isSuperBoss) {
                    localStorage.setItem('rpg_boss_ran_away', 'true');
                }

                setTimeout(finishBattle, 1200);
            }
            else {
                say('p', "실패..!");
                addLog("도망치는데 실패했습니다!");
                setTimeout(eTurn, 1500);
            }
        }

        function openItemModal() {
            if(isActing) return;
            const modal = document.getElementById('item-modal');
            const list = document.getElementById('item-list');
            list.innerHTML = '';
            const potions = player.inventory.filter(i => i.type.includes('potion'));
            const potionGroups = {};
            potions.forEach((p, idx) => {
                const originalIdx = player.inventory.indexOf(p);
                if (!potionGroups[p.name]) potionGroups[p.name] = { item: p, count: 0, indices: [] };
                potionGroups[p.name].count++;
                potionGroups[p.name].indices.push(originalIdx);
            });

            if (Object.keys(potionGroups).length === 0) {
                list.innerHTML = '<p style="color:#888; text-align:center; padding:20px;">사용 가능한 아이템이 없습니다.</p>';
            } else {
                for (const key in potionGroups) {
                    const group = potionGroups[key];
                    const item = group.item;
                    const div = document.createElement('div');
                    div.className = 'battle-item-row';
                    let iconSrc = item.img || ITEM_IMAGES[item.type] || 'potion_hp.jpg';

                    div.innerHTML = `<img src="image/${iconSrc}" class="battle-item-icon"><div class="battle-item-info"><div class="battle-item-name">${item.name}<span class="battle-item-count">x${group.count}</span></div><div class="battle-item-desc">${item.desc}</div></div>`;
                    div.onclick = () => useBattleItem(group.indices[0]);
                    list.appendChild(div);
                }
            }
            modal.style.display = 'flex';
        }

        function closeItemModal() { document.getElementById('item-modal').style.display = 'none'; }

        function useBattleItem(index) {
            closeItemModal();
            if(isActing) return;
            const item = player.inventory[index];
            if (!item) return;

            let handledByPopup = false;

            if (item.type === 'potion_full') {
                isActing = true;
                player.hp = player.maxHp;
                player.mp = player.maxMp;
                addLog(`<span style="color:#00e676">풀 회복 포션</span>을 사용하여 HP와 MP를 모두 회복했습니다!`);
                playPotionSfx();
            } else if (item.name.includes('체력')) {
                if (player.hp >= player.maxHp) { addLog("체력이 이미 가득 찼습니다."); return; }
                isActing = true;
                const heal = item.val;
                player.hp = Math.min(player.hp + heal, player.maxHp);
                addLog(`<span style="color:#ff5252">체력 물약</span>을 사용하여 HP를 <span style="color:#00e676">${heal}</span> 회복했습니다.`);
                playPotionSfx();
            } else if (item.name.includes('마나')) {
                if (player.mp >= player.maxMp) { addLog("마나가 이미 가득 찼습니다."); return; }
                isActing = true;
                const heal = item.val;
                player.mp = Math.min(player.mp + heal, player.maxMp);
                addLog(`<span style="color:#2979ff">마나 물약</span>을 사용하여 MP를 <span style="color:#2979ff">${heal}</span> 회복했습니다.`);
                playPotionSfx();
            } else if (item.name.includes('경험치')) {
                isActing = true;
                player.exp += item.val;
                addLog(`<span style="color:#e040fb">경험치 물약</span>을 사용하여 경험치를 <span style="color:#e040fb">${item.val}</span> 획득했습니다!`);
                playPotionSfx();
            } else if (item.type === 'potion_poison') {
                if (pStatus.poison <= 0) { addLog("독 상태가 아닙니다."); return; }
                isActing = true;
                pStatus.poison = 0;
                addLog(`<span style="color:#00e676">해독 물약</span>을 사용하여 독을 치료했습니다!`);
                playPotionSfx();
                const cureEl = document.getElementById('p-cure');
                cureEl.style.display = 'block';
                setTimeout(() => { cureEl.style.display = 'none'; }, 1000);
            } else if (item.type === 'potion_skeleton') {
                isActing = true;
                player.hp = player.maxHp;
                player.mp = player.maxMp;
                player.battleCurse = true;
                addLog(`<span style="color:#757575">해골 포션</span>을 사용하여 체력과 마나를 모두 회복했습니다...`);
                playPotionSfx();
            } else if (item.type === 'potion_focus') {
                isActing = true;
                pStatus.nextSkillZeroCost = 1;
                pStatus.skillDmgUp = 3;
                showEffectPopup("정신 집중", "다음 스킬 마나 소모 0\n3턴간 스킬 데미지 50% 증가", item.img || "potion_focus.jpg");
                playPotionSfx();
                handledByPopup = true;
            } else if (item.type === 'potion_holy') {
                isActing = true;
                pStatus.poison = 0;
                pStatus.stun = 0;
                addLog(`<span style="color:#00e676">정화의 성수</span>가 모든 상태 이상을 씻어냈습니다!`);
                playPotionSfx();
                const cureEl = document.getElementById('p-cure');
                cureEl.style.display = 'block';
                setTimeout(() => { cureEl.style.display = 'none'; }, 1000);
            } else if (item.type === 'potion_madness') {
                isActing = true;
                const dmg = Math.floor(player.hp * 0.3);
                player.hp = Math.max(1, player.hp - dmg);
                pStatus.critUp = 3;
                showDamage('player-frame', dmg, 'player_hit');
                showEffectPopup("광기의 힘", `HP ${dmg} 감소\n3턴간 크리티컬 100%`, item.img || "potion_madness.jpg");
                playPotionSfx();
                handledByPopup = true;
            } else if (item.type === 'potion_gamble') {
                isActing = true;
                player.inventory.splice(index, 1);
                const rand = Math.random() * 100;
                playItemSfx();

                if (rand < 5) { // 1. 황금의 손
                    const stolenGold = (player.level * 150) + 300;
                    player.gold += stolenGold;
                    addLog(`<span style='color:gold; font-weight:bold;'>💰 황금의 손! 적을 털어 ${stolenGold}G를 얻고 승리했습니다!</span>`);
                    setTimeout(win, 1000);
                    return;
                }
                else if (rand < 15) { // 2. 시공간의 뒤틀림
                    const pHpP = player.hp / player.maxHp;
                    const eHpP = enemy.hp / enemy.maxHp;
                    player.hp = player.maxHp * eHpP;
                    enemy.hp = enemy.maxHp * pHpP;
                    addLog("<span style='color:#9c27b0;'>🌀 시공간의 뒤틀림! 적과 나의 체력 비율이 바뀌었습니다!</span>");
                }
                else if (rand < 30) { // 3. 독이 든 성배
                    eStatus.poison = 5; pStatus.poison = 3;
                    addLog("<span style='color:#4caf50;'>🧪 독이 든 성배! 서로에게 치명적인 독을 주입합니다.</span>");
                }
                else if (rand < 55) { // 4. 미완성된 폭발
                    const pDmg = Math.floor(player.hp * 0.3);
                    const eDmg = Math.floor(enemy.hp * 0.3);
                    player.hp -= pDmg; enemy.hp -= eDmg;
                    showDamage('player-frame', pDmg, 'player_hit');
                    showDamage('enemy-frame', eDmg, 'normal');
                    triggerScreenShake(true);
                    addLog("<span style='color:#ff5722;'>💥 미완성된 폭발! 모두에게 현재 체력의 30% 피해를 입힙니다!</span>");
                }
                else if (rand < 65) { // 5. 가방의 기적
                    const potions = player.inventory.filter(i => i.type.includes('potion') && i.type !== 'potion_gamble');
                    if (potions.length > 0) {
                        const randomPotion = potions[Math.floor(Math.random() * potions.length)];
                        if (player.inventory.length < 24) {
                            player.inventory.push({...randomPotion});
                            addLog(`<span style='color:#e040fb;'>🎒 가방의 기적! [${randomPotion.name}]을(를) 복사했습니다!</span>`);
                        } else {
                            addLog(`<span style='color:#e040fb;'>🎒 가방이 가득 차 [${randomPotion.name}]의 효과를 즉시 발동합니다!</span>`);
                            player.hp = Math.min(player.maxHp, player.hp + 50);
                        }
                    } else { addLog("복사할 물약이 없어 효과가 소멸했습니다."); }
                }
                else if (rand < 75) { // 6. 분노의 화신
                    rage = 100; player.rage = 100;
                    addLog("<span style='color:#ff9800; font-weight:bold;'>🔥 분노의 화신! 분노 게이지가 즉시 충전됩니다!</span>");
                }
                else if (rand < 95) { // 7. 강제 차원 이동
                    addLog("<span style='color:#607d8b;'>🌫️ 강제 차원 이동! 전투에서 강제로 이탈합니다.</span>");
                    setTimeout(finishBattle, 1200);
                    return;
                }
                else { // 8. 신의 가호
                    pStatus.invincible = 3;
                    player.hp = Math.min(player.maxHp, player.hp + (player.maxHp * 0.5));
                    player.mp = Math.min(player.maxMp, player.mp + (player.maxMp * 0.5));
                    addLog("<span style='color:#ffd700; font-weight:bold;'>✨ 신의 가호! 3턴 무적 및 체력/마나가 회복됩니다!</span>");
                }

                update();
                if (enemy.hp <= 0) setTimeout(win, 1000);
                else if (player.hp <= 0) showGameOver("도박의 대가는 죽음이었습니다.");
                else setTimeout(eTurn, 1500);
                return;
            }

            player.inventory.splice(index, 1);

            if (!handledByPopup) {
                update();
                setTimeout(eTurn, 1500);
            }
        }

        function showEffectPopup(title, desc, img) {
            document.getElementById('effect-title').innerText = title;
            document.getElementById('effect-desc').innerText = desc;
            document.getElementById('effect-img').src = 'image/' + img;
            document.getElementById('effect-modal').style.display = 'flex';
        }

        function closeEffectModal() {
            document.getElementById('effect-modal').style.display = 'none';
            update();
            setTimeout(eTurn, 1500);
        }
    </script>
</body>
</html>
